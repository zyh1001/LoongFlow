    react_max_steps: 6


# ==============================================================================
# Main evolution process
# ==============================================================================

evolve:

  task: |
    You are a mathematical physicist studying symbolic representations of
    complex fractional-quantum-Hall wavefunctions in disk geometry.

    Scientific objective
    --------------------
    Discover compact and physically meaningful analytic candidates for the
    complete complex many-body wavefunction Psi.

    The candidate expression represents the full physical wavefunction,
    including its spatial envelope and correlation structure.

    This is a structure-discovery task. Search for analytic expressions that
    generalize to unseen electron coordinates.

    Do not memorize, interpolate, or otherwise encode individual data rows.

    The goal is not merely to minimize a numerical loss. The goal is to
    discover simple analytic structures that can be interpreted and tested
    as physical hypotheses.


    Physical system
    ---------------
    The target state describes two fully spin-polarized interacting electrons
    confined to an infinite two-dimensional plane.

    The electrons interact through the Coulomb interaction.

    A spatially uniform magnetic field B is applied perpendicular to the
    electron plane.

    Parallel to the electron plane, at distance

        d = 0.1 l_B,

    there is a uniformly positively charged disk of radius a carrying total
    charge +Ne.

    The positive background disk provides both charge neutralization and a
    rotationally symmetric confining potential.

    The disk radius is chosen such that the total magnetic flux through the
    disk satisfies

        Phi = B * pi * a^2 = N Phi_0 / nu,

    where

        Phi_0 = h / e

    is the magnetic flux quantum.

    Using

        l_B^2 = hbar / (e B)

    and

        Phi_0 = 2*pi*hbar / e,

    the disk radius is

        a = sqrt(2*N/nu) * l_B.

    With

        N  = 2,
        nu = 1/3,

    this gives

        a = sqrt(12) * l_B
          approximately 3.4641 * l_B.

    Since all coordinates supplied to candidate expressions are measured in
    units of l_B, the dimensionless disk radius used in the symbolic
    regression problem is therefore

        a / l_B = sqrt(12)
                approximately 3.4641.

    The Landau-level-mixing parameter of the target state is

        lambda = 5,

    where lambda is the ratio between the Coulomb interaction energy scale
    and the cyclotron energy scale.

    That is, lambda = \[ \boxed{ \kappa = \frac{e^2m^\ast}{4\pi\epsilon_0\epsilon_r\hbar^2} \sqrt{\frac{\hbar}{eB}} } \] in SI units.

    The target neural-network wavefunction lives in the full real-space
    Hilbert space.

    It is NOT assumed to be exactly projected into the lowest Landau level.

    Therefore, exact holomorphicity must not be imposed as a hard constraint.

    Holomorphic expressions remain an important physically motivated baseline
    in the weak-Landau-level-mixing regime, but non-holomorphic corrections
    are allowed when supported by evaluator evidence.


    Units and scaling
    -----------------
    All electron coordinates supplied to candidate expressions are
    dimensionless and measured in magnetic-length units:

        r -> r / l_B.

    Therefore x_i, y_i, z_i, relative distances, center-of-mass coordinates,
    and fitted length scales appearing in candidate expressions are all
    dimensionless.

    The candidate expression represents the complete wavefunction, including
    any spatial envelope required by the physical state.

    Do not mix dimensional and dimensionless quantities.


    Complex-coordinate convention
    -----------------------------
    IMPORTANT: use the following convention throughout the entire search:

        z1 = x1 - i*y1
        z2 = x2 - i*y2

    This is the convention used by the target data and evaluator.

    Do not change this convention.

    Define

        z_rel = z1 - z2
        Z_cm  = (z1 + z2) / 2
        r_rel = |z_rel|.

    Complex-conjugate variables and other radial invariants may also be used
    when physically motivated.


    Electron exchange
    -----------------
    The two electrons are identical spin-polarized fermions.

    Therefore the candidate wavefunction must satisfy fermionic exchange
    antisymmetry:

        Psi(r1, r2) = -Psi(r2, r1).

    Under exchange of the two electrons,

        z_rel -> -z_rel,
        Z_cm  ->  Z_cm.

    Use these transformation properties when constructing candidate
    expressions.

    Prefer structures in which antisymmetry is transparent from the analytic
    form rather than being produced accidentally by fitted numerical
    coefficients.


    Rotational symmetry
    -------------------
    The Hamiltonian and confining potential are invariant under continuous
    rotations around the center of the disk.

    With the convention

        z_i = x_i - i*y_i,

    a counterclockwise physical rotation of all electron coordinates by an
    angle phi transforms

        z_i -> exp(-i*phi) z_i.

    ----------------------------------------------------------------------
    ANGULAR-MOMENTUM CONDITION:

    The target state is expected to be an eigenstate of the total
    z-component angular-momentum operator.

    Search only for candidate structures that are compatible with a
    well-defined integer total angular momentum

        M in Z.

    Because

        z_i = x_i - i*y_i

    transforms under a counterclockwise physical rotation as

        z_i -> exp(-i*phi) z_i,

    an angular-momentum eigenstate should transform as

        Psi(
            exp(-i*phi) z1,
            exp(-i*phi) z2,
            ...
        )
        =
        exp(-i*M*phi) Psi(z1, z2, ...)

    for some integer M.

    Different structural candidates may correspond to different integer
    angular-momentum sectors.

    Use evaluator feedback to infer which sector is supported by the target
    wavefunction.

    Prefer candidates that transform with a single well-defined integer M
    rather than superpositions of unrelated angular-momentum sectors.
    ----------------------------------------------------------------------


    Candidate interface
    -------------------
    Modify only code between

        EVOLVE-BLOCK-START

    and

        EVOLVE-BLOCK-END.

    Preserve the function

        candidate_spec()

    exactly as specified in initial_program.py.

    candidate_spec() must return one candidate expression together with its
    numerical parameter initialization using the exact interface documented
    in initial_program.py.

    Do not change:

    - function names;
    - function arguments;
    - imports;
    - evaluator code;
    - code outside the evolution block.


    Physical requirements
    ---------------------
    Prefer candidates that:

    1. satisfy fermionic antisymmetry under exchange of the two electrons;

    2. belong to a well-defined total-angular-momentum sector consistent
       with the rotational symmetry of the disk;

    3. remain finite throughout the sampled physical domain except at points
       where a singular analytic representation is explicitly physically
       justified;

    4. respect the stated complex-coordinate convention;

    5. treat holomorphic expressions as important baseline candidates but do
       not assume exact lowest-Landau-level projection;

    6. allow conjugate or radial variables when they produce genuine
       full-data improvement or a simpler physical description;

    7. admit a clear interpretation in terms of relative motion,
       center-of-mass motion, pair correlations, radial corrections, or
       Landau-level-mixing corrections.


    Search space
    ------------
    Begin with structurally simple candidate families.

    Prioritize:

    - low-degree polynomials in relative and center-of-mass variables;

    - factored expressions;

    - products and small integer powers;

    - antisymmetric factors multiplied by symmetric corrections;

    - simple rational functions;

    - simple functions of rotationally meaningful radial invariants.

    Exponentials of compact radial functions are physically meaningful
    Jastrow-like candidate structures and may be explored.

    However, avoid deeply nested transcendental expressions unless simpler
    candidate families have clearly failed.

    Prefer compact expressions whose physical transformation properties can
    be understood analytically.

    Use at most 10 fitted numerical parameters.

    Do not manually search arbitrary decimal constants when an
    evaluator-fitted numerical parameter can be used instead.


    Hypothesis families
    -------------------
    Maintain structural diversity across the search.

    Useful hypothesis families include:

    - predominantly holomorphic relative-coordinate expressions;

    - factored antisymmetric expressions;

    - symmetric corrections multiplying an antisymmetric factor;

    - relative-coordinate dominated expressions;

    - center-of-mass corrections;

    - radial corrections;

    - conjugate-coordinate corrections;

    - mixed holomorphic and non-holomorphic structures associated with
      Landau-level mixing.

    These are search directions, not assumed answers.

    Do not assume beforehand which family is correct.


    Search strategy
    ---------------
    Treat each new candidate as a physical hypothesis.

    Change one important structural idea at a time whenever possible.

    Use evaluator feedback to determine whether the next modification should
    improve:

    - predictive accuracy;
    - complex-wavefunction fidelity;
    - exchange antisymmetry;
    - rotational/angular-momentum consistency;
    - numerical stability;
    - or analytic simplicity.

    Do not repeatedly modify only fitted numerical constants.

    Numerical parameters are fitted by the evaluator; the evolutionary search
    should focus primarily on analytic structure.

    When an expression performs well, investigate whether individual terms
    can be removed while retaining its full-data fit quality.

    When progress stagnates, explore a qualitatively different structural
    family rather than indefinitely increasing the complexity of the current
    candidate.


    Evaluation
    ----------
    All finite neural-network samples belong to one full-data pool.

    Numerical parameters are fitted on this complete pool, and the same pool
    is used to score candidate expressions. There is no held-out validation
    or test split in this task.

    Evolution uses full-data metrics such as:

    - full-data normalized error;
    - complex-wavefunction fidelity;
    - electron-exchange error;
    - angular-momentum or rotation error;
    - non-finite output fraction;
    - expression complexity.

    The complete data pool is uniformly sampled over the coordinate domain.

    Prefer a simpler formula when two candidates have similar full-data
    quality.

    A small reduction in numerical error does not justify a large increase
    in analytic complexity.

    Prohibited behavior
    -------------------
    Candidate code must not:

    - read dataset files directly;
    - inspect evaluator source code;
    - inspect checkpoints;
    - inspect logs;
    - inspect previous output files;
    - use lookup tables;
    - use nearest-neighbor interpolation;
    - memorize individual samples;
    - use row-dependent branches;
    - use random predictions;
    - launch subprocesses;
    - access the network;
    - dynamically generate executable code.

    Do not hard-code an expected analytic solution.

    Physical knowledge should be used to constrain and organize the search,
    not to insert a presumed final answer.


    Success criterion
    -----------------
    A successful search should produce a small collection of low-complexity
    analytic formulas with:

    - strong full-data fidelity;
    - low full-data error;
    - correct fermionic exchange behavior;
    - correct rotational/angular-momentum behavior;
    - stable finite numerical values;
    - reproducible structures across independent runs;
    - and a clear physical interpretation.

    The final objective is to identify compact analytic structures that can
    be tested as physical hypotheses for the neural-network wavefunction.


  # --------------------------------------------------------------------------
  # Components
  # --------------------------------------------------------------------------

  planner_name: "evolve_planner"
  executor_name: "evolve_executor_fuse"
  summary_name: "evolve_summary"


  # --------------------------------------------------------------------------
  # Evolution parameters
  # --------------------------------------------------------------------------

  max_iterations: 200
  target_score: 0.995
  concurrency: 1


  # --------------------------------------------------------------------------
  # Evaluator
  # --------------------------------------------------------------------------

  evaluator:
    timeout: 1200


  # --------------------------------------------------------------------------
  # Evolutionary database
  # --------------------------------------------------------------------------

  database:
    storage_type: "in_memory"
    num_islands: 3
    population_size: 90
    checkpoint_interval: 5
    sampling_weight_power: 2
